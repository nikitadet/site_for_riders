name: Update weather

on:
  schedule:
    - cron: '*/30 * * * *'   # каждые 30 минут
  workflow_dispatch:          # ручной запуск кнопкой

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch weather
        env:
          OWM_KEY: ${{ secrets.OWM_KEY }}
        run: python scripts/fetch_weather.py
      - name: Commit and push
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "🌦️ weather update"
          git push
